<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Birthday Room 🎂</title>

    <link rel="stylesheet" href="birthday-room.css">

</head>

<body>

    <!-- ========================= -->
    <!-- PARTY POPPER -->
    <!-- ========================= -->

    <div id="celebration">

        <div class="popper left">🎉</div>
        <div class="popper right">🎉</div>

    </div>


    <!-- ========================= -->
    <!-- BIRTHDAY ROOM -->
    <!-- ========================= -->

    <div id="birthdayRoom">


        <!-- LIGHTS -->

        <div class="lights">
            ✨ ✨ ✨ ✨ ✨ ✨ ✨
        </div>


        <!-- BANNER -->

        <div class="banner">
            🎉 HAPPY BIRTHDAY 🎉
        </div>


        <!-- BALLOONS -->

        <div class="balloon balloon1">🎈</div>
        <div class="balloon balloon2">🎈</div>
        <div class="balloon balloon3">🎈</div>

        <div class="balloon balloon4">🎈</div>
        <div class="balloon balloon5">🎈</div>
        <div class="balloon balloon6">🎈</div>


        <!-- ========================= -->
        <!-- GIRL -->
        <!-- ========================= -->

        <div class="character girl">

            <div class="characterHead">

                <div class="hair"></div>

                <div class="eye eye1"></div>
                <div class="eye eye2"></div>

                <div class="cheek cheek1"></div>
                <div class="cheek cheek2"></div>

                <div class="mouth"></div>

            </div>


            <div class="girlBody">

                <div class="arm leftArm"></div>
                <div class="arm rightArm"></div>

                <div class="dress">
                    💗
                </div>

                <div class="leg leftLegCharacter"></div>
                <div class="leg rightLegCharacter"></div>

                <div class="shoe leftShoe"></div>
                <div class="shoe rightShoe"></div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- BIRTHDAY BOY -->
        <!-- ========================= -->

        <div class="character boy">

            <div class="characterHead boyHead">

                <div class="boyHair"></div>

                <div class="eye eye1"></div>
                <div class="eye eye2"></div>

                <div class="cheek cheek1"></div>
                <div class="cheek cheek2"></div>

                <div class="mouth"></div>

            </div>


            <div class="boyBody">

                <div class="arm leftArm"></div>
                <div class="arm rightArm"></div>

                <div class="shirt">
                    ❤️
                </div>

                <div class="leg leftLegCharacter"></div>
                <div class="leg rightLegCharacter"></div>

                <div class="shoe leftShoe"></div>
                <div class="shoe rightShoe"></div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- TABLE -->
        <!-- ========================= -->

        <div class="table">

            <div class="tableTop"></div>

            <div class="tableLeg leftLeg"></div>
            <div class="tableLeg rightLeg"></div>


            <!-- CAKE -->

            <div class="cake">

                <!-- CANDLE -->

                <div class="candle" id="candle">

                    <div class="flame" id="flame">
                        🔥
                    </div>

                </div>


                <!-- CAKE -->

                <div class="cakeTop" id="cake">

                    <span class="cakeEmoji">
                        🎂
                    </span>

                    <span class="cakeSlice">
                        🍰
                    </span>

                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- KNIFE -->
        <!-- ========================= -->

        <div class="knife" id="knife">
            🔪
        </div>


        <!-- ========================= -->
        <!-- CANDLE MESSAGE -->
        <!-- ========================= -->

        <div id="candleMessage">

            🕯️ Make a wish & blow the candle! 💕

        </div>


        <!-- ========================= -->
        <!-- CAKE MESSAGE -->
        <!-- ========================= -->

        <div id="cakeMessage"
             class="cakeMessage"
             style="display:none;">

            🔪 Click the knife to cut the cake! 🎂

        </div>


        <!-- FLOOR DECOR -->

        <div class="floorDecor">
            ❤️ ✨ 💕 ✨ ❤️
        </div>


    </div>


    <script src="birthday-room.js"></script>

</body>

</html>
