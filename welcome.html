<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome ❤️</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#1a0033,#32004d,#ff4d94);
    overflow:hidden;
    font-family:'Poppins',sans-serif;
}

/* Floating Hearts */
.heart{
    position:absolute;
    bottom:-50px;
    font-size:25px;
    animation:float 8s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh);
        opacity:0;
    }
}

/* Card */

.container{

    width:85%;
    max-width:550px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(12px);

    border-radius:25px;

    padding:40px;

    text-align:center;

    color:white;

    box-shadow:0 0 25px rgba(255,255,255,.2);

}

h1{

    font-size:45px;

}

h2{

    color:#ffd6e7;

}

p{

    line-height:30px;

    font-size:18px;

}

button{

    margin-top:25px;

    padding:15px 35px;

    border:none;

    border-radius:40px;

    background:#ff4d94;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    transform:scale(1.08);

    background:#ff0066;

}

</style>

</head>

<body>

<div class="heart" style="left:10%;animation-duration:7s;">❤️</div>
<div class="heart" style="left:30%;animation-duration:9s;">💖</div>
<div class="heart" style="left:50%;animation-duration:8s;">💕</div>
<div class="heart" style="left:70%;animation-duration:10s;">💗</div>
<div class="heart" style="left:90%;animation-duration:6s;">💞</div>

<div class="container">

<h1>✨ Welcome ✨</h1>

<h2>Happy Birthday ❤️</h2>

<p>
I've prepared something very special for you.<br><br>

But before opening your surprise,<br>
you'll have to complete a tiny challenge. 😊
</p>

<button onclick="startJourney()">
Begin Your Journey ❤️
</button>

</div>

<script>

function startJourney(){

window.location.href="instruction.html";

}

</script>

</body>
</html>
