<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secret Door 🔐</title>

    <link rel="stylesheet" href="password.css">
</head>

<body>

    <div class="passwordScreen">

        <div class="passwordCard">

            <div class="lock">🔐</div>

            <h1>A Secret Door Awaits...</h1>

            <p>Only someone special knows the key 👀❤️</p>

            <input
                type="password"
                id="passwordInput"
                placeholder="Enter password"
            >

            <button onclick="checkPassword()">
                🔓 Unlock
            </button>

            <p id="message"></p>

        </div>

    </div>

    <script src="password.js"></script>

</body>
</html>
