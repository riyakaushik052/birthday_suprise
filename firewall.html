<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Final Firewall ❤️</title>

    <link rel="stylesheet" href="firewall.css">

</head>

<body>

    <div class="firewallScreen">

        <div class="lockIcon">🔐</div>

        <h1>❤️ FINAL FIREWALL ❤️</h1>

        <p class="subtitle">
            One last little barrier...
        </p>

        <div class="firewallBox">

            <div class="security">
                🛡️ SECURITY SYSTEM ACTIVE
            </div>

            <div class="loadingBar">
                <div id="progress"></div>
            </div>

            <p id="status">
                Firewall protecting the final surprise...
            </p>

            <button id="breakBtn">
                🔥 Break the Firewall
            </button>

        </div>

    </div>


    <!-- FINAL MESSAGE -->

    <div id="finalMessage">

        <div class="heart">❤️</div>

        <h1>For You...</h1>

        <p class="quote">

            “Some surprises end with a gift,
            but this one ends with a little reminder
            of how special you are to me. ❤️”

        </p>

        <div class="finalLove">
            Love you ❤️
        </div>

        <div class="sparkles">
            ✨ 💕 ✨ 💕 ✨
        </div>

    </div>


    <script src="firewall.js"></script>

</body>

</html>
